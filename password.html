<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Master Password Generator Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #111827;
            border: 2px solid #00f2fe;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.25);
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 460px;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            color: #00f2fe;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        p.subtitle {
            color: #9ca3af;
            font-size: 13px;
            margin-bottom: 20px;
        }

        /* Password Display Box */
        .result-container {
            background: #1f2937;
            border: 1px solid #374151;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .result-container input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
            width: 80%;
            outline: none;
        }

        .action-icons {
            display: flex;
            gap: 15px;
        }

        .action-icons button {
            background: transparent;
            border: none;
            color: #00f2fe;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.2s, color 0.2s;
        }

        .action-icons button:hover {
            transform: scale(1.1);
            color: #60efff;
        }
        
        #downloadBtn {
            color: #00ff87;
        }
        #downloadBtn:hover {
            color: #60efff;
        }

        /* Strength Bar */
        .strength-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 0 5px;
        }

        .strength-text {
            font-size: 13px;
            color: #9ca3af;
        }

        .strength-bar {
            height: 6px;
            width: 65%;
            background: #374151;
            border-radius: 3px;
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            width: 0%;
            background: #ef4444;
            transition: all 0.4s ease;
        }

        /* Settings Panel */
        .settings-panel {
            background: #182232;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: left;
            border: 1px solid #1f2937;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .setting-row:last-child {
            margin-bottom: 0;
        }

        .setting-row label {
            font-size: 13px;
            color: #d1d5db;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .length-slider {
            width: 65%;
            accent-color: #00f2fe;
            cursor: pointer;
        }

        #lengthValue {
            font-weight: bold;
            color: #00f2fe;
            font-size: 15px;
        }

        .checkbox-container input {
            accent-color: #00f2fe;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        /* History Panel */
        .history-panel {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: left;
            max-height: 120px;
            overflow-y: auto;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 12px;
            color: #9ca3af;
            border-bottom: 1px solid #1f2937;
            padding-bottom: 4px;
        }

        .clear-history {
            background: transparent;
            border: none;
            color: #ef4444;
            cursor: pointer;
        }

        .history-item {
            font-size: 13px;
            color: #d1d5db;
            padding: 4px 0;
            font-family: monospace;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Buttons */
        .btn-generate {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border: none;
            border-radius: 12px;
            color: #000000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.5);
        }

        /* Toast Alert */
        .toast {
            position: fixed;
            bottom: 20px;
            background: #00f2fe;
            color: #000;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4);
            display: none;
            animation: fadeInUp 0.3s ease;
            z-index: 999;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1><i class="fa-solid fa-shield-halved"></i> PASSWORD PRO</h1>
    <p class="subtitle">Ultimate working tools with file auto-download feature</p>

    <div class="result-container">
        <input type="text" id="passwordDisplay" placeholder="Click Generate!" readonly>
        <div class="action-icons">
            <button id="downloadBtn" title="Download TXT File"><i class="fa-solid fa-file-arrow-down"></i></button>
            <button id="copyBtn" title="Copy Password"><i class="fa-regular fa-copy"></i></button>
        </div>
    </div>

    <div class="strength-container">
        <span class="strength-text" id="strengthLabel">Strength: Empty</span>
        <div class="strength-bar">
            <div class="strength-fill" id="strengthFill"></div>
        </div>
    </div>

    <div class="settings-panel">
        <div class="setting-row">
            <label>Length</label>
            <input type="range" id="lengthSlider" min="8" max="32" value="14" class="length-slider">
            <span id="lengthValue">14</span>
        </div>
        <div class="setting-row">
            <label><i class="fa-solid fa-font"></i> Capital Letters (A-Z)</label>
            <div class="checkbox-container"><input type="checkbox" id="uppercase" checked></div>
        </div>
        <div class="setting-row">
            <label><i class="fa-solid fa-text-height"></i> Small Letters (a-z)</label>
            <div class="checkbox-container"><input type="checkbox" id="lowercase" checked></div>
        </div>
        <div class="setting-row">
            <label><i class="fa-solid fa-hashtag"></i> Numbers (0-9)</label>
            <div class="checkbox-container"><input type="checkbox" id="numbers" checked></div>
        </div>
        <div class="setting-row">
            <label><i class="fa-solid fa-icons"></i> Symbols (@-$-%)</label>
            <div class="checkbox-container"><input type="checkbox" id="symbols" checked></div>
        </div>
        <div class="setting-row" style="border-top: 1px solid #1f2937; padding-top: 8px; margin-top: 8px;">
            <label style="color: #60efff;"><i class="fa-solid fa-eye-slash"></i> Exclude Confusing (i, 1, o, 0)</label>
            <div class="checkbox-container"><input type="checkbox" id="excludeSimilar"></div>
        </div>
        <div class="setting-row">
            <label style="color: #00ff87;"><i class="fa-solid fa-bolt"></i> Auto Copy on Generate</label>
            <div class="checkbox-container"><input type="checkbox" id="autoCopy"></div>
        </div>
    </div>

    <div class="history-panel">
        <div class="history-header">
            <span>RECENT HISTORY</span>
            <button class="clear-history" id="clearHistoryBtn"><i class="fa-solid fa-trash-can"></i> Clear</button>
        </div>
        <div id="historyList"></div>
    </div>

    <button class="btn-generate" id="generateBtn">
        <i class="fa-solid fa-wand-magic-sparkles"></i> GENERATE PASSWORD
    </button>
</div>

<div class="toast" id="toast">Copied!</div>

<script>
    const passwordDisplay = document.getElementById('passwordDisplay');
    const copyBtn = document.getElementById('copyBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const generateBtn = document.getElementById('generateBtn');
    const lengthSlider = document.getElementById('lengthSlider');
    const lengthValue = document.getElementById('lengthValue');
    
    const uppercaseCheck = document.getElementById('uppercase');
    const lowercaseCheck = document.getElementById('lowercase');
    const numbersCheck = document.getElementById('numbers');
    const symbolsCheck = document.getElementById('symbols');
    const excludeSimilarCheck = document.getElementById('excludeSimilar');
    const autoCopyCheck = document.getElementById('autoCopy');
    
    const strengthLabel = document.getElementById('strengthLabel');
    const strengthFill = document.getElementById('strengthFill');
    const historyList = document.getElementById('historyList');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');
    const toast = document.getElementById('toast');

    let passHistory = [];

    // Chars banks
    const baseChars = {
        uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
        lowercase: 'abcdefghijklmnopqrstuvwxyz',
        numbers: '0123456789',
        symbols: '!@#$%^&*()_+~`|}{[]:;?><,./-='
    };

    lengthSlider.addEventListener('input', (e) => { lengthValue.innerText = e.target.value; });

    // Main Password Generator Logic
    function generatePassword() {
        const length = parseInt(lengthSlider.value);
        let allowedChars = '';
        let password = '';

        if (uppercaseCheck.checked) allowedChars += baseChars.uppercase;
        if (lowercaseCheck.checked) allowedChars += baseChars.lowercase;
        if (numbersCheck.checked) allowedChars += baseChars.numbers;
        if (symbolsCheck.checked) allowedChars += baseChars.symbols;

        if (allowedChars === '') {
            alert('Bhai, kam se kam ek box select karein!');
            return;
        }

        // Exclude feature active code
        if (excludeSimilarCheck.checked) {
            allowedChars = allowedChars.replace(/[il1Lo0O]/g, '');
        }

        for (let i = 0; i < length; i++) {
            const randomIndex = Math.floor(Math.random() * allowedChars.length);
            password += allowedChars[randomIndex];
        }

        passwordDisplay.value = password;
        updateStrength(password);
        addToHistory(password);

        // Auto copy feature code
        if (autoCopyCheck.checked) {
            copyToClipboard(password, "Generated & Copied Automatically!");
        }
    }

    // Live Strength Check Logic
    function updateStrength(password) {
        let score = 0;
        if (password.length >= 12) score++;
        if (password.length >= 16) score++;
        if (/[A-Z]/.test(password)) score++;
        if (/[0-9]/.test(password)) score++;
        if (/[^A-Za-z0-9]/.test(password)) score++;

        if (score <= 2) {
            strengthLabel.innerText = "Strength: Weak 🔴";
            strengthLabel.style.color = "#ef4444";
            strengthFill.style.width = "33%";
            strengthFill.style.background = "#ef4444";
        } else if (score === 3 || score === 4) {
            strengthLabel.innerText = "Strength: Medium 优质 🟡";
            strengthLabel.style.color = "#f59e0b";
            strengthFill.style.width = "66%";
            strengthFill.style.background = "#f59e0b";
        } else {
            strengthLabel.innerText = "Strength: Absolute Strong 🔥";
            strengthLabel.style.color = "#00ff87";
            strengthFill.style.width = "100%";
            strengthFill.style.background = "#00ff87";
        }
    }

    // History log logic
    function addToHistory(pass) {
        if(passHistory.includes(pass)) return;
        passHistory.unshift(pass); // Naya password top par daalein
        if(passHistory.length > 5) passHistory.pop(); // Max 5 items rakhein
        
        renderHistory();
    }

    function renderHistory() {
        historyList.innerHTML = '';
        passHistory.forEach(pass => {
            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `<span>${pass.substring(0, 18)}${pass.length > 18 ? '...' : ''}</span> 
            <i class="fa-regular fa-copy" style="color:#00f2fe; cursor:pointer;" onclick="copyToClipboard('${pass}', 'History Password Copied!')"></i>`;
            historyList.appendChild(item);
        });
    }

    clearHistoryBtn.addEventListener('click', () => {
        passHistory = [];
        historyList.innerHTML = '<span style="font-size:12px; color:#4b5563;">History Cleared</span>';
    });

    // Helper Copy function
    function copyToClipboard(text, message) {
        if(!text || text === "Click Generate!") return;
        navigator.clipboard.writeText(text).then(() => {
            toast.innerText = message;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2000);
        });
    }

    copyBtn.addEventListener('click', () => {
        copyToClipboard(passwordDisplay.value, "Password Copied to Clipboard!");
    });

    // WORKING DOWNLOAD LOGIC (.txt format file download)
    downloadBtn.addEventListener('click', () => {
        const pass = passwordDisplay.value;
        if (!pass || pass === "Click Generate!") {
            alert("Pehle password generate karein!");
            return;
        }

        const date = new Date().toLocaleString();
        const fileContent = `=========================================\n` +
                            `        SECURE PASSWORD GENERATED        \n` +
                            `=========================================\n\n` +
                            `Password : ${pass}\n` +
                            `Length   : ${pass.length} characters\n` +
                            `Date/Time: ${date}\n\n` +
                            `-----------------------------------------\n` +
                            `Keep this file safe and don't share it!`;

        const blob = new Blob([fileContent], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Secure-Password-${pass.substring(0,4)}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        
        toast.innerText = "TXT File Downloaded Successfully! 📂";
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 2500);
    });

    generateBtn.addEventListener('click', generatePassword);
    window.onload = generatePassword; // Run on setup
</script>

</body>
  </html>
