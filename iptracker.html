<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZAN TRACKER PRO | CYBER SECURITY SUITE</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00f0ff;
            --neon-pink: #ff007f;
            --cyber-grid: #090d16;
            --terminal-dark: #020408;
            --text-glow: 0 0 10px rgba(0, 240, 255, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Space Mono', monospace;
        }

        body {
            background-color: var(--terminal-dark);
            background-image: linear-gradient(rgba(18, 24, 38, 0.95) 2px, transparent 2px),
                              linear-gradient(90deg, rgba(18, 24, 38, 0.95) 2px, transparent 2px);
            background-size: 30px 30px;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .app-container {
            width: 100%;
            max-width: 460px;
            background: rgba(10, 15, 26, 0.85);
            backdrop-filter: blur(12px);
            border: 2px solid var(--neon-cyan);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2), inset 0 0 15px rgba(0, 240, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        /* Branding Header */
        .brand-header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px dashed rgba(0, 240, 255, 0.3);
            padding-bottom: 15px;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: var(--text-glow);
        }

        .brand-title span {
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink);
        }

        .developer-badge {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #64748b;
            margin-top: 5px;
        }

        .developer-badge strong {
            color: var(--neon-cyan);
            font-weight: bold;
        }

        /* Input Controls */
        .input-wrapper {
            position: relative;
            margin-bottom: 15px;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--neon-cyan);
        }

        .cyber-input {
            width: 100%;
            background: #060913;
            border: 1px solid rgba(0, 240, 255, 0.3);
            padding: 15px 15px 15px 45px;
            border-radius: 12px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s;
        }

        .cyber-input:focus {
            border-color: var(--neon-cyan);
            box-shadow: var(--text-glow);
            background: #0b1122;
        }

        /* Heavy Buttons Grid */
        .action-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-core {
            background: linear-gradient(135deg, #00f0ff 0%, #0072ff 100%);
            color: #000;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-transform: uppercase;
        }

        .btn-core:hover {
            box-shadow: 0 0 15px var(--neon-cyan);
            transform: translateY(-1px);
        }

        .btn-sec {
            background: rgba(255, 0, 127, 0.1);
            border: 1px solid var(--neon-pink);
            color: var(--neon-pink);
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-sec:hover {
            background: var(--neon-pink);
            color: #fff;
            box-shadow: 0 0 15px var(--neon-pink);
        }

        /* Terminal System Screen */
        .terminal-screen {
            background: #02050a;
            border: 1px solid #1e293b;
            border-radius: 14px;
            padding: 15px;
            height: 180px;
            overflow-y: auto;
            font-size: 0.8rem;
            color: #38bdf8;
            margin-bottom: 20px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .terminal-screen::-webkit-scrollbar {
            width: 4px;
        }
        .terminal-screen::-webkit-scrollbar-thumb {
            background: rgba(0, 240, 255, 0.2);
            border-radius: 2px;
        }

        .cmd-line { margin-bottom: 6px; line-height: 1.4; }
        .cmd-success { color: #4ade80; }
        .cmd-error { color: var(--neon-pink); }

        /* Output Metrics Panel */
        .intel-panel {
            background: rgba(2, 5, 10, 0.6);
            border: 1px dashed rgba(0, 240, 255, 0.2);
            border-radius: 14px;
            padding: 15px;
            display: none;
            animation: panelFade 0.4s ease;
        }

        @keyframes panelFade {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .panel-title {
            font-size: 0.8rem;
            color: var(--neon-pink);
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #0f172a;
            font-size: 0.82rem;
        }

        .data-label { color: #94a3b8; }
        .data-value { color: #ffffff; font-weight: bold; }

        .footer-sig {
            text-align: center;
            font-size: 0.65rem;
            color: #475569;
            margin-top: 20px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Main Brand Header -->
        <div class="brand-header">
            <div class="brand-title">AZAN <span>TOOLS</span></div>
            <div class="developer-badge">SYSTEM ARCHITECT: <strong>AZAN ASHIQ</strong></div>
        </div>

        <!-- Input Deck -->
        <div class="input-wrapper">
            <i class="fas fa-network-wired"></i>
            <input type="text" class="cyber-input" id="ipInputField" placeholder="Target IP Address (e.g., 8.8.8.8)">
        </div>

        <!-- Control Station -->
        <div class="action-grid">
            <button class="btn-core" onclick="executeIntellScan()"><i class="fas fa-satellite-dish"></i> Run Deep Scan</button>
            <button class="btn-sec" onclick="flushTerminalMemory()" title="Wipe Logs"><i class="fas fa-skull-crossbones"></i></button>
        </div>

        <!-- Real-time Cyber Monitor Logs -->
        <div class="terminal-screen" id="terminalLogBox">
            <div class="cmd-line">[SYSTEM] AZAN TOOLS Core Interface Initialized successfully.</div>
            <div class="cmd-line">[STATUS] Awaiting Target Signature Array Deployment...</div>
        </div>

        <!-- Extracted Intel Display Card -->
        <div class="intel-panel" id="intelOutputPanel">
            <div class="panel-title"><i class="fas fa-fingerprint"></i> Intercepted Intel Payload</div>
            <div id="intelDataRows">
                <!-- Programmatic Row Injection Matrix -->
            </div>
        </div>

        <div class="footer-sig">SECURE UTILITY CORE SYSTEM // VER 4.0.9</div>
    </div>

    <script>
        const terminal = document.getElementById('terminalLogBox');
        const intelPanel = document.getElementById('intelOutputPanel');
        const intelRows = document.getElementById('intelDataRows');

        function writeToTerminal(msg, mode = 'info') {
            const line = document.createElement('div');
            line.className = 'cmd-line';
            if(mode === 'success') line.classList.add('cmd-success');
            if(mode === 'error') line.classList.add('cmd-error');
            
            line.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}`;
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }

        async function executeIntellScan() {
            const ipTarget = document.getElementById('ipInputField').value.trim();
            if(!ipTarget) {
                writeToTerminal("CRITICAL: Tracking aborted. Target Vector IP cannot be blank.", "error");
                return;
            }

            // UI Refresh Reset
            intelPanel.style.display = 'none';
            intelRows.innerHTML = '';

            writeToTerminal(`Establishing Handshake Protocol with Server for Target: ${ipTarget}...`);
            writeToTerminal("Bypassing firewalls... Initializing AZAN Geo-Location Sub-routine.");

            try {
                // Heavy Field Extractor API Matrix
                const queryUrl = `http://ip-api.com/json/${ipTarget}?fields=status,message,country,countryCode,regionName,city,zip,lat,lon,timezone,isp,org,as,query`;
                const response = await fetch(queryUrl);
                const payload = await response.json();

                if(payload.status === 'success') {
                    writeToTerminal("Data Pipeline Synchronized! Decoding payload...", "success");
                    
                    setTimeout(() => {
                        writeToTerminal("Target identity mapping finalized. Injecting matrix rows.", "success");
                        
                        const dataset = [
                            { label: "IP Target Address", value: payload.query },
                            { label: "ISP Network Provider", value: payload.isp },
                            { label: "Organization Node", value: payload.org || "N/A" },
                            { label: "Autonomous System", value: payload.as },
                            { label: "Country / Code", value: `${payload.country} (${payload.countryCode})` },
                            { label: "Region / State", value: payload.regionName },
                            { label: "City Location", value: payload.city },
                            { label: "ZIP Area Code", value: payload.zip || "Unknown" },
                            { label: "Geo Coordinates", value: `${payload.lat}, ${payload.lon}` },
                            { label: "Timezone Identifier", value: payload.timezone }
                        ];

                        dataset.forEach(item => {
                            const row = document.createElement('div');
                            row.className = 'data-row';
                            row.innerHTML = `
                                <span class="data-label">${item.label}</span>
                                <span class="data-value">${item.value}</span>
                            `;
                            intelRows.appendChild(row);
                        });

                        intelPanel.style.display = 'block';
                    }, 800);

                } else {
                    writeToTerminal(`SCAN FAILED: API rejected request -> ${payload.message}`, "error");
                }
            } catch(error) {
                writeToTerminal("FATAL INTERRUPT: Connection timed out or server refused array mapping.", "error");
            }
        }

        function flushTerminalMemory() {
            terminal.innerHTML = `<div class="cmd-line" style="color:var(--neon-pink)">[ALERT] Memory Purged by System Admin: AZAN ASHIQ.</div>`;
            intelPanel.style.display = 'none';
            intelRows.innerHTML = '';
        }
    </script>
</body>
  </html>
