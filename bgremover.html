<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium AI BG Remover</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #111827;
            border: 2px solid #00f2fe;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.2);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            margin: auto;
        }

        h1 {
            font-size: 24px;
            color: #00f2fe;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        p.subtitle {
            color: #9ca3af;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .upload-box {
            border: 2px dashed #4b5563;
            padding: 30px 20px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #1f2937;
            margin-bottom: 20px;
        }

        .upload-box:hover {
            border-color: #00f2fe;
            background: #1e2e3d;
        }

        .upload-box i {
            font-size: 40px;
            color: #00f2fe;
            margin-bottom: 10px;
        }

        .upload-box p {
            font-size: 15px;
            color: #d1d5db;
        }

        #fileInput {
            display: none;
        }

        .preview-container {
            display: none;
            margin-top: 15px;
            margin-bottom: 20px;
            position: relative;
        }

        .preview-container img {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 10px;
            border: 1px solid #374151;
            background-image: linear-gradient(45deg, #1f2937 25%, transparent 25%), linear-gradient(-45deg, #1f2937 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #1f2937 75%), linear-gradient(-45deg, transparent 75%, #1f2937 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #000;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.6);
        }

        .btn-primary:disabled {
            background: #4b5563;
            color: #9ca3af;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .btn-success {
            background: linear-gradient(135deg, #00ff87 0%, #60efff 100%);
            color: #000;
            display: none; /* Shuru me chupa rahega */
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 255, 135, 0.5);
        }

        /* Loading Spinner */
        .spinner {
            display: none;
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border-left-color: #000;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-text {
            font-size: 13px;
            color: #00f2fe;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1><i class="fa-solid fa-wand-magic-sparkles"></i> AI BG REMOVER</h1>
    <p class="subtitle">Apni image ka background automatic saaf karein</p>

    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
        <i class="fa-solid fa-cloud-arrow-up"></i>
        <p id="uploadText">Select Image From Mobile</p>
        <input type="file" id="fileInput" accept="image/*">
    </div>

    <div class="preview-container" id="previewContainer">
        <img id="imagePreview" src="" alt="Preview">
    </div>

    <button class="btn btn-primary" id="removeBtn" disabled>
        <div class="spinner" id="spinner"></div>
        <span id="btnText"><i class="fa-solid fa-scissors"></i> REMOVE BACKGROUND</span>
    </button>

    <button class="btn btn-success" id="downloadBtn">
        <i class="fa-solid fa-download"></i> DOWNLOAD IMAGE
    </button>

    <div class="status-text" id="statusText">Processing... Please wait.</div>
</div>

<script>
    // ⚠️ APNI REMOVE.BG KI API KEY YAHAAN DAALEIN
    const API_KEY = "AZqRDhUjQWamiFTYdrk3ZudU"; "YOUR_REMOVE_BG_API_KEY_HERE"; 

    const fileInput = document.getElementById('fileInput');
    const uploadText = document.getElementById('uploadText');
    const previewContainer = document.getElementById('previewContainer');
    const imagePreview = document.getElementById('imagePreview');
    const removeBtn = document.getElementById('removeBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btnText');
    const statusText = document.getElementById('statusText');

    let selectedFile = null;
    let resultImageBlobUrl = null;

    // Image select hone par preview dikhane ke liye
    fileInput.addEventListener('change', function(e) {
        selectedFile = e.target.files[0];
        if (selectedFile) {
            uploadText.innerText = selectedFile.name;
            
            const reader = new FileReader();
            reader.onload = function(event) {
                imagePreview.src = event.target.result;
                previewContainer.style.display = 'block';
                removeBtn.disabled = false; // Button active karein
                downloadBtn.style.display = 'none'; // Purana download button chhupayein
            }
            reader.readAsDataURL(selectedFile);
        }
    });

    // Background Remove karne ka main logic
    removeBtn.addEventListener('click', async function() {
        if (!selectedFile) return;

        if (API_KEY === "YOUR_REMOVE_BG_API_KEY_HERE" || API_KEY === "") {
            alert("Bhai, pehle code ke andar apni remove.bg ki API Key daal lo!");
            return;
        }

        // UI ko loading state me daalein
        removeBtn.disabled = true;
        spinner.style.display = 'block';
        btnText.innerText = "Saaf Ho Raha Hai...";
        statusText.style.display = 'block';

        const formData = new FormData();
        formData.append('image_file', selectedFile);
        formData.append('size', 'auto');

        try {
            const response = await fetch('https://api.remove.bg/v1.0/removebg', {
                method: 'POST',
                headers: {
                    'X-Api-Key': API_KEY
                },
                body: formData
            });

            if (response.ok) {
                const blob = await response.blob();
                // Purani URL ko clean karein agar pehle se bani ho
                if (resultImageBlobUrl) URL.revokeObjectURL(resultImageBlobUrl);
                
                resultImageBlobUrl = URL.createObjectURL(blob);
                
                // Image preview ko badlein (ab transparent image dikhegi)
                imagePreview.src = resultImageBlobUrl;
                
                // Download button dikhayein
                downloadBtn.style.display = 'flex';
                statusText.innerText = "Background kamyabi se saaf ho gaya!";
            } else {
                const errorData = await response.json();
                alert("Galti: " + (errorData.errors[0].title || "Kuch gaddbad hui"));
            }
        } catch (error) {
            console.error(error);
            alert("Internet ya network ka masala hai, dobara koshish karein.");
        } finally {
            // Loading khatam karein
            spinner.style.display = 'none';
            removeBtn.disabled = false;
            btnText.innerHTML = `<i class="fa-solid fa-scissors"></i> REMOVE BACKGROUND`;
            setTimeout(() => { statusText.style.display = 'none'; }, 4000);
        }
    });

    // Image download karne ka function
    downloadBtn.addEventListener('click', function() {
        if (!resultImageBlobUrl) return;
        const a = document.createElement('a');
        a.href = resultImageBlobUrl;
        a.download = 'no-bg-' + (selectedFile ? selectedFile.name.split('.')[0] : 'image') + '.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    });
</script>

</body>
  </html>
