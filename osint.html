<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSINT - Target Intelligence</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: #1f2833;
            border: 2px solid #ff007f;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.2);
        }

        .back-btn {
            color: #66fcf1;
            text-decoration: none;
            font-size: 14px;
            display: inline-block;
            margin-bottom: 20px;
            transition: 0.3s;
        }

        .back-btn:hover {
            text-shadow: 0 0 5px #66fcf1;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #ff007f;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.4);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #45f3ff;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: #0b0c10;
            border: 1px solid #45f3ff;
            border-radius: 6px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            box-shadow: 0 0 10px rgba(69, 243, 255, 0.5);
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 2px solid #ff007f;
            color: #ff007f;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s ease;
        }

        .action-btn:hover {
            background: #ff007f;
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
        }

        .report-section {
            margin-top: 25px;
        }

        .report-section h2 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #c5c6c7;
        }

        .report-box {
            width: 100%;
            height: 240px;
            background: #0b0c10;
            border: 1px solid #1f2833;
            border-radius: 6px;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            overflow-y: auto;
            white-space: pre-wrap;
            color: #00ff00;
        }

        .download-btn {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            background: #45f3ff;
            border: none;
            color: #0b0c10;
            font-weight: bold;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            display: none;
            transition: 0.3s;
        }

        .download-btn:hover {
            box-shadow: 0 0 10px rgba(69, 243, 255, 0.5);
        }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-btn">&larr; Back to Dashboard</a>
    
    <div class="header">
        <h1>🕵️‍♂️ Target Intelligence<br>(OSINT Pro)</h1>
    </div>

    <div class="input-group">
        <label for="target">Enter Target Domain or IP Address:</label>
        <input type="text" id="target" placeholder="e.g., google.com or 8.8.8.8">
    </div>

    <button class="action-btn" id="gatherBtn">Gather Intelligence</button>

    <div class="report-section">
        <h2>Intelligence Report:</h2>
        <div class="report-box" id="reportOutput">Enter a target and press button to start gathering footprinting data...</div>
    </div>

    <button class="download-btn" id="downloadBtn">📥 Download Report (TXT)</button>
</div>

<script>
    document.getElementById('gatherBtn').addEventListener('click', async () => {
        const targetInput = document.getElementById('target').value.trim();
        const reportOutput = document.getElementById('reportOutput');
        const downloadBtn = document.getElementById('downloadBtn');

        if (!targetInput) {
            reportOutput.innerText = "Error: Please enter a valid domain or IP address.";
            return;
        }

        reportOutput.innerText = "[*] Initializing OSINT Scan...\n[*] Resolving target and fetching intelligence data, please wait...\n";
        downloadBtn.style.display = 'none';

        try {
            let cleanTarget = targetInput.replace(/^(https?:\/\/)?(www\.)?/, '').split('/')[0];
            let ipToScan = cleanTarget;

            const ipRegex = /^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$/;
            
            if (!ipRegex.test(cleanTarget)) {
                reportOutput.innerText += `[*] Target recognized as domain. Resolving IP for: ${cleanTarget}...\n`;
                
                const dnsResponse = await fetch(`https://cloudflare-dns.com/dns-query?name=${cleanTarget}&type=A`, {
                    headers: { 'Accept': 'application/dns-json' }
                });
                const dnsData = await dnsResponse.json();
                
                if (dnsData.Answer && dnsData.Answer.length > 0) {
                    ipToScan = dnsData.Answer[0].data;
                    reportOutput.innerText += `[+] Resolved IP: ${ipToScan}\n\n`;
                } else {
                    throw new Error("Could not resolve domain to an IP address.");
                }
            }

            const response = await fetch(`https://ipapi.co/${ipToScan}/json/`);
            const data = await response.json();

            if (data.error) {
                throw new Error(data.reason || "API rejected the request.");
            }

            let report = `========================================\n`;
            report += `        OSINT TARGET INTELLIGENCE        \n`;
            report += `========================================\n\n`;
            report += `[+] Target Domain       : ${cleanTarget}\n`;
            report += `[+] Resolved/Scanned IP : ${data.ip}\n`;
            report += `[+] Network/ASN        : ${data.asn || 'N/A'} (${data.org || 'N/A'})\n`;
            report += `[+] City/Region        : ${data.city || 'N/A'}, ${data.region || 'N/A'}\n`;
            report += `[+] Country            : ${data.country_name || 'N/A'} (${data.country_code || 'N/A'})\n`;
            report += `[+] Latitude/Longitude : ${data.latitude || 'N/A'}, ${data.longitude || 'N/A'}\n`;
            report += `[+] Timezone           : ${data.timezone || 'N/A'}\n`;
            report += `[+] Currency           : ${data.currency_name || 'N/A'}\n\n`;
            report += `========================================\n`;
            report += `[*] Scan finished successfully.\n`;

            reportOutput.innerText = report;
            downloadBtn.style.display = 'block';

            downloadBtn.onclick = () => {
                const blob = new Blob([report], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `OSINT_Report_${cleanTarget}.txt`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

        } catch (error) {
            reportOutput.innerText = `[!] Error occurred during footprinting: ${error.message}\n\n💡 Tip: Check karein target domain valid ho aur internet active ho.`;
        }
    });
</script>

</body>
  </html>
